<!DOCTYPE html>
<html>
<head>
<title>Registration Form | vtucode</title>
<style>
body{
  font-family:Arial;
  background:#f0f4f8;
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.container{
  max-width:600px;width:100%;
  background:#fff;padding:20px;
  border-radius:8px;
  box-shadow:0 0 10px #0002;
  display:flex;flex-direction:column;gap:15px;
}
h2{text-align:center;margin:0;color:#333}
.form-group
{display:flex;flex-direction:column;gap:5px}
label
{font-size:14px;color:#555}
input,select,textarea{
  padding:10px;border:1px solid #ccc;
  border-radius:4px;font-size:14px
}
.gender-options{display:flex;gap:10px;align-items:center}
.button-group{display:flex;gap:10px}
.button-group input{
  flex:1;border:0;border-radius:4px;
  padding:10px;font-size:16px;cursor:pointer;color:#fff
}
input[type=submit]{background:#4CAF50}
input[type=reset]{background:#f44336}
</style>
</head>

<body>
<div class="container">
<h2>Registration Form</h2>
<form>
  <div class="form-group"><label>First Name</label><input required></div>
  <div class="form-group"><label>Last Name</label><input required></div>
  <div class="form-group"><label>Email</label><input type="email" required></div>
  <div class="form-group"><label>Password</label><input type="password" required></div>
  <div class="form-group"><label>DOB</label><input type="date"></div>

  <div class="form-group">
    <label>Gender</label>
    <div class="gender-options">
      <input type="radio" name="g">Male
      <input type="radio" name="g">Female
    </div>
  </div>

  <div class="form-group">
    <label>Country</label>
    <select>
      <option>USA</option><option>Canada</option>
      <option>UK</option><option>India</option>
    </select>
  </div>

  <div class="form-group"><label>Bio</label><textarea rows="4"></textarea></div>

  <div class="button-group">
    <input type="submit" value="Register">
    <input type="reset" value="Reset">
  </div>
</form>
</div>
</body>
</html>
