<!DOCTYPE html>
<html>
<head>
<title>Simple Calculator | vtucode</title>
<style>
body{
 font-family:Arial;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
 margin:0;
}
.calculator{
 background:#fff;
 padding:20px;
 width:320px;
 text-align:center;
 border-radius:12px;
 box-shadow:0 4px 8px #0003;
}
h1{
 background:#000;
 color:#fff;
 padding:10px;
 border-radius:8px;
 margin-bottom:30px;
}
input,select,button{
 width:100%;
 margin:10px 0;
 padding:12px;
 font-size:16px;
 border:1px solid #0002;
 border-radius:8px;
 box-sizing:border-box;
}
input:focus,select:focus,button:focus{
 outline:0;
 border-color:#007bff;
 box-shadow:0 0 0 3px #268fff40;
}
button{
 background:#007bff;
 color:#fff;
 border:0;
 cursor:pointer;
 font-size:18px;
}
button:hover,button:focus{
 box-shadow:0 0 0 2px #fff,0 0 0 4px #007bff;
}
#result{
 font-size:18px;
 background:#afffe2;
 border:1px solid #ccc;
 border-radius:8px;
 box-shadow:0 2px 4px #0002;
 opacity:0;
 transform:translateY(-20px);
 transition:.5s;
}
#result.show{
 opacity:1;
 margin-top:20px;
 padding:15px;
 transform:translateY(0);
}
#result.error{
 background:#ffdddd;
 border-color:red;
}
#result.success{
 background:#6ef08d38;
 border-color:#47e56d;
 font-size:17px;
 font-weight:500;
}
</style>
</head>

<body>
<div class="calculator">
<h1>Simple Calculator</h1>
<input type="number" id="num1" placeholder="Enter first number">
<input type="number" id="num2" placeholder="Enter second number">
<select id="operation">
<option value="">Select Operation</option>
<option value="sum">Sum</option>
<option value="product">Product</option>
<option value="difference">Difference</option>
<option value="remainder">Remainder</option>
<option value="quotient">Quotient</option>
<option value="power">Power</option>
<option value="sqrt">Square Root</option>
<option value="square">Square</option>
</select>
<button onclick="calculate()">Calculate</button>
<div id="result"></div>
</div>

<script>
function calculate(){
 let n1=parseFloat(num1.value),
     n2=parseFloat(num2.value),
     op=operation.value,
     r="",cls="success";

 if(isNaN(n1)||isNaN(n2)){
  r="Please enter valid numbers.";cls="error";
 }else{
  switch(op){
   case"sum":r=`Sum: ${n1+n2}`;break;
   case"product":r=`Product: ${n1*n2}`;break;
   case"difference":r=`Difference: ${n1-n2}`;break;
   case"remainder":r=`Remainder: ${n1%n2}`;break;
   case"quotient":
    if(n2==0){r="Cannot divide by zero";cls="error";}
    else r=`Quotient: ${n1/n2}`;break;
   case"power":r=`Power: ${n1**n2}`;break;
   case"sqrt":
    if(n1<0||n2<0){r="Square root is not defined for negative numbers";cls="error";}
    else r=`Square Root of ${n1}: ${Math.sqrt(n1)}<br>Square Root of ${n2}: ${Math.sqrt(n2)}`;break;
   case"square":
    r=`Square of ${n1}: ${n1*n1}<br>Square of ${n2}: ${n2*n2}`;break;
   default:r="Please select an operation.";cls="error";
  }
 }
 result.innerHTML=r;
 result.className="";
 result.classList.add(cls,"show");
}
</script>
</body>
</html>
